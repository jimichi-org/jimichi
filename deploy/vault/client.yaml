# the two clients of deploy/base with -vault: the identity and the contact come
# from a volume of /vault/peer.vault on a claim of the default storage class, so
# they outlive a pod, and every pod starts locked until scripts/vault.sh opens
# it; scripts/introduce.sh cannot introduce them. Only make vault-demo applies
# this file, for the time of the demonstration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-a
  namespace: jimichi
  labels: {app: client, client: a}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: client, client: a}
  template:
    metadata:
      labels: {app: client, client: a}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: client
          image: jimichi/client:dev
          imagePullPolicy: IfNotPresent
          # the anchor is public; the CA key itself never enters the cluster
          env:
            - name: JIMICHI_SUITE
              valueFrom:
                configMapKeyRef: {name: jimichi-config, key: suite}
            - name: JIMICHI_CA
              valueFrom:
                configMapKeyRef: {name: jimichi-ca, key: anchor}
          # the admin port 127.0.0.1:9201 is reached only through a port-forward
          args:
            - "-suite"
            - "$(JIMICHI_SUITE)"
            - "-ca"
            - "$(JIMICHI_CA)"
            - "-nodes"
            - "relay-1.jimichi.svc.cluster.local:9000,relay-2.jimichi.svc.cluster.local:9000,relay-3.jimichi.svc.cluster.local:9000,relay-4.jimichi.svc.cluster.local:9000,relay-5.jimichi.svc.cluster.local:9000"
            - "-hops"
            - "3"
            - "-mode"
            - "fixed"
            - "-rate"
            - "200ms"
            - "-peer"
            - "-mailbox"
            - "relay-5.jimichi.svc.cluster.local:9000"
            - "-count"
            - "0"
            - "-interval"
            - "2s"
            - "-vault"
            - "/vault/peer.vault"
          volumeMounts:
            - {name: vault, mountPath: /vault}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: vault
          persistentVolumeClaim: {claimName: vault-client-a}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-b
  namespace: jimichi
  labels: {app: client, client: b}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: client, client: b}
  template:
    metadata:
      labels: {app: client, client: b}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: client
          image: jimichi/client:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: JIMICHI_SUITE
              valueFrom:
                configMapKeyRef: {name: jimichi-config, key: suite}
            - name: JIMICHI_CA
              valueFrom:
                configMapKeyRef: {name: jimichi-ca, key: anchor}
          args:
            - "-suite"
            - "$(JIMICHI_SUITE)"
            - "-ca"
            - "$(JIMICHI_CA)"
            - "-nodes"
            - "relay-1.jimichi.svc.cluster.local:9000,relay-2.jimichi.svc.cluster.local:9000,relay-3.jimichi.svc.cluster.local:9000,relay-4.jimichi.svc.cluster.local:9000,relay-5.jimichi.svc.cluster.local:9000"
            - "-hops"
            - "3"
            - "-mode"
            - "fixed"
            - "-rate"
            - "200ms"
            - "-peer"
            - "-mailbox"
            - "relay-5.jimichi.svc.cluster.local:9000"
            - "-respond"
            - "-interval"
            - "0"
            - "-vault"
            - "/vault/peer.vault"
          volumeMounts:
            - {name: vault, mountPath: /vault}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: vault
          persistentVolumeClaim: {claimName: vault-client-b}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-client-a
  namespace: jimichi
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Mi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-client-b
  namespace: jimichi
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Mi}}
