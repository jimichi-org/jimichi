apiVersion: v1
kind: Namespace
metadata:
  name: jimichi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-1
  namespace: jimichi
  # hop only tells the relays apart: a client may put any of them at any
  # place of its chain
  labels: {app: relay, hop: "1"}
spec:
  replicas: 1
  # a new pod is a new identity that enrollment must find alone
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: relay, hop: "1"}
  template:
    metadata:
      labels: {app: relay, hop: "1"}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: jimichi/relay:dev
          imagePullPolicy: IfNotPresent
          # every relay keeps a mailbox at the exit; the clients of the stand
          # end their chains on relay-5, so the others count no mailbox requests
          args: ["-listen", ":9000", "-info", ":9100", "-period", "190ms", "-onion-rotate", "1h", "-descriptor-ttl", "20m", "-exit", "mailbox",
                 "-name", "relay-1", "-advertise", "relay-1.jimichi.svc.cluster.local:9000"]
          ports:
            - {name: cells, containerPort: 9000}
            - {name: info, containerPort: 9100}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet: {path: /healthz, port: info}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-1
  namespace: jimichi
spec:
  selector: {app: relay, hop: "1"}
  ports:
    - {name: cells, port: 9000, targetPort: cells}
    - {name: info, port: 9100, targetPort: info}
---
