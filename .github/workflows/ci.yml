name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # linux is the target platform: this is where mlock and dump prevention
      # actually run, so the race detector and the real secmem path go together
      - name: unit and integration tests
        run: go test -race -count=1 ./...
      - name: optimized six-flow GOST timing-mark integration
        run: |
          log="$RUNNER_TEMP/mark-gost-optimized.log"
          go test -count=1 -v -run '^TestMarkLiveGOSTSixFlowsOptimized$' ./lab > "$log" || { cat "$log"; exit 1; }
          cat "$log"
          test "$(grep -c -- '--- PASS: TestMarkLiveGOSTSixFlowsOptimized' "$log")" -eq 3
          grep -Fq -- '--- PASS: TestMarkLiveGOSTSixFlowsOptimized/gost-active (' "$log"
          grep -Fq -- '--- PASS: TestMarkLiveGOSTSixFlowsOptimized/gost-sham (' "$log"
      - name: standard handshake vectors
        run: go test -race -count=1 -tags noisevectors ./noise ./crypto/noisevector
      - name: optimized controlled-node observation integration
        run: |
          sudo prlimit --pid "$$" --memlock=536870912:536870912
          log="$RUNNER_TEMP/nodeview-optimized.log"
          go test -count=1 -timeout 20m -v -run '^TestNodeViewLiveOptimized$' ./lab/nodeview > "$log" || { cat "$log"; exit 1; }
          cat "$log"
          ! grep -Eq -- '--- SKIP: TestNodeViewLiveOptimized|warning: no tests to run' "$log"
          test "$(grep -c -- '--- PASS: TestNodeViewLiveOptimized' "$log")" -eq 19
          grep -Fq -- '--- PASS: TestNodeViewLiveOptimized (' "$log"
          for suite in c25519 gost; do
            grep -Fq -- "--- PASS: TestNodeViewLiveOptimized/$suite (" "$log"
            for case in one-role two-edge two-adjacent-first two-adjacent-last trusted-admission foreign-peer foreign-mailbox mailbox-records; do
              grep -Fq -- "--- PASS: TestNodeViewLiveOptimized/$suite/$case (" "$log"
            done
          done
      - name: optimized cooperative key memory integration
        run: |
          log="$RUNNER_TEMP/keymem-optimized.log"
          go test -count=1 -v -run '^TestKeymemLiveOptimized$' ./lab/keymem > "$log" || { cat "$log"; exit 1; }
          cat "$log"
          ! grep -Fq -- '--- SKIP: TestKeymemLiveOptimized' "$log"
          test "$(grep -c -- '--- PASS: TestKeymemLiveOptimized' "$log")" -eq 13
          grep -Fq -- '--- PASS: TestKeymemLiveOptimized (' "$log"
          for suite in c25519 gost; do
            for policy in none all; do
              for checkpoint in active closed-now closed-1s; do
                grep -Fq -- "--- PASS: TestKeymemLiveOptimized/$suite/$policy/$checkpoint (" "$log"
              done
            done
          done
      # the threat model cites these as the check of key memory: the log must show
      # both as passed, and a rename that leaves the pattern matching nothing fails
      - name: key memory flags
        run: |
          log="$RUNNER_TEMP/secmem.log"
          go test -race -count=1 -v -run '^(TestProtectedPagesAreLockedAndUndumpable|TestOffHeapWithoutMeasuresIsPlainMapping)$' ./crypto/secmem > "$log" || { cat "$log"; exit 1; }
          cat "$log"
          test "$(grep -c -- '--- PASS' "$log")" -eq 2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # the tool must be built by the same toolchain as the module it scans
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  cluster:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build images
        run: |
          docker build --build-arg TARGET=relay -t jimichi/relay:dev .
          docker build --build-arg TARGET=client -t jimichi/client:dev .
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: jimichi
          config: deploy/kind/ci.yaml
      # enroll.sh builds cmd/jimichi on the runner, where the CA lives for the run
      - name: deploy, enroll and wait for a round trip
        env:
          CERT_TTL: 1h
        run: bash scripts/e2e.sh
