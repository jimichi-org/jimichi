name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # linux is the target platform: this is where mlock and dump prevention
      # actually run, so the race detector and the real secmem path go together
      - name: unit and integration tests
        run: go test -race -count=1 ./...
      # the threat model cites these as the check of key memory: the log must show
      # both as passed, and a rename that leaves the pattern matching nothing fails
      - name: key memory flags
        run: |
          log="$RUNNER_TEMP/secmem.log"
          go test -race -count=1 -v -run '^(TestProtectedPagesAreLockedAndUndumpable|TestOffHeapWithoutMeasuresIsPlainMapping)$' ./crypto/secmem > "$log" || { cat "$log"; exit 1; }
          cat "$log"
          test "$(grep -c -- '--- PASS' "$log")" -eq 2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # the tool must be built by the same toolchain as the module it scans
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  cluster:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build images
        run: |
          docker build --build-arg TARGET=relay -t jimichi/relay:dev .
          docker build --build-arg TARGET=client -t jimichi/client:dev .
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: jimichi
          config: deploy/kind/ci.yaml
      - name: load images
        run: kind load docker-image jimichi/relay:dev jimichi/client:dev --name jimichi
      # enroll.sh builds cmd/jimichi on the runner, where the CA lives for the run
      - name: deploy, enroll and wait for a round trip
        env:
          CERT_TTL: 1h
        run: bash scripts/e2e.sh
